[project]
name = "togetherflow"
version = "0.1.0"
description = "Amortized Bayesian inference for multi-agent motion dynamics in immersive rooms"
requires-python = ">=3.12,<3.14"

dependencies = [
    # Trajectory inference uses environments/superstats/requirements.txt:
    # its released dependency pins conflict with the current BayesFlow release.
    "bayesflow==2.0.14",
    "jax>=0.11.0",
    "numba>=0.68",
    "numpy>=2.5.1",
    "matplotlib>=3.10",
    "pandas>=3.0",
    "scipy>=1.17",
]

[project.optional-dependencies]
cuda = ["jax[cuda13]==0.11.2"]

[dependency-groups]
# Installed by `uv sync` by default; not required to run the experiments.
dev = [
    "jupyter>=1.1",
    "jupyterlab>=4.5",
    "ipykernel>=7",
    "seaborn>=0.13",
    "tqdm>=4.67",
]

# A build backend makes this a real (editable-installable) package rather than a
# "virtual" project, so `uv sync` keeps `import togetherflow` working from any
# working directory.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["togetherflow*"]
